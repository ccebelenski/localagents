name: Feature request
description: Suggest a capability or improvement
title: '[Feature]: '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describing the underlying need helps more than a specific solution.
        Please check existing issues first.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The workflow that is awkward or missing today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like localagents to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds (optional)
    validations:
      required: false
