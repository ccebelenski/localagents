name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --dev
      # Unit tests only: they exercise the shim's request/error rewriting and the
      # registry's matching, none of which needs a model server.
      - run: uv run pytest -q
      - run: uv run python -c "import localagents"
