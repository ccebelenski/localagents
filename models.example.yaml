# Example config — copy to models.yaml (gitignored) and edit for your setup.
defaults:
  # model: qwen3.8-27b   # optional preference (served id, glob or fuzzy name); default = first live endpoint
  permission_mode: acceptEdits
  allowed_tools: [Read, Edit, Write, Glob, Grep, Bash, WebFetch]
  disallowed_tools: [Agent, Task]
  setting_sources: [project, local]
  max_turns: 60
  timeout_s: 1800
  probe_timeout_s: 2.5
  system_prompt_append: |
    You are running as a delegated sub-agent on a local model. Work only on the task you were given,
    verify your changes (run tests/builds where they exist), and finish with a concise report: what you changed (file paths),
    how you verified it, and anything you could not complete.

# That's the whole config: where your servers are. Models are never listed here. What each
# endpoint is serving right now, its context window and its slot occupancy are discovered live
# on every call, so nothing needs updating when you swap a model. Order matters: with no model
# named, the first endpoint that is up and serving something is used.
endpoints:
  llamacpp:
    base_url: http://127.0.0.1:8080
    backend: llama.cpp
  vllm:
    base_url: http://127.0.0.1:8000
    backend: vllm
  gpu-server:
    base_url: http://gpu-server.lan:8000   # a bigger box on the LAN running vLLM
    backend: vllm
    host: gpu-server

